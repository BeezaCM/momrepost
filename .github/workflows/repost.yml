name: repost

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -U yt-dlp feedparser requests

      - run: python repost.py
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: Save state
        if: always()
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          for f in seen.json backlog.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "update state" || exit 0
          git push
